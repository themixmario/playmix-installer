name: Build APK

# Builds the PlayMix2Samsung APK.
#  - Every push to main builds the APK and publishes it as release v1.0.<run number>
#    (the app's own update check reads the latest release).
#  - Run manually (Actions > Build APK > Run workflow): same, on demand.
# With the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS set, the APK is
# signed with your own key (updates install over older builds). Without them it is signed with a
# throwaway debug key: fine to try it, not to distribute.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Version
        shell: bash
        run: |
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SIGN=()
          if [ -n "${KS_B64}" ]; then
            echo "${KS_B64}" | base64 -d > "$PWD/playmix.keystore"
            SIGN=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$PWD/playmix.keystore"
                  -p:AndroidSigningKeyAlias="$KS_ALIAS" -p:AndroidSigningStorePass="$KS_PASS" -p:AndroidSigningKeyPass="$KS_PASS")
            echo "Signing with the repository key."
          else
            echo "::warning::No signing secrets: the APK uses a throwaway debug key."
          fi
          dotnet publish Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj \
            -c Release -f net10.0-android \
            -p:ApplicationDisplayVersion="$VERSION_NAME" \
            -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            "${SIGN[@]}" -o publish/android
          mkdir -p dist
          APK=$(ls publish/android/*-Signed.apk 2>/dev/null | head -n1 || true)
          [ -z "$APK" ] && APK=$(ls publish/android/*.apk | head -n1)
          cp "$APK" "dist/PlayMix2Samsung-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PlayMix2Samsung-${{ env.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION_NAME" dist/*.apk --target "$GITHUB_SHA" --title "PlayMix2Samsung $VERSION_NAME" --notes "APK para instalar PlayMix TV en tu Samsung."
